<section class="vitals-section">

    <div class="page-header">
        <div>
            <h2><i class="fa-solid fa-heart-pulse"></i> Daily Vitals</h2>
            <p>Record and monitor patient vitals.</p>
        </div>
    </div>

    <!-- Patient Selector -->
    <div class="card">
        <div class="card-header"><h3>Select Patient</h3></div>
        <div class="card-body">
            <div class="search-bar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="vitalsPatientSearch" placeholder="Search patient..." />
                </div>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Patient</th><th>Doctor</th>
                            <th>Ward</th><th>Status</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="vitalsPatientBody">
                        <tr><td colspan="6" class="text-center">Loading patients...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Vitals History -->
    <div class="card" id="vitalsHistoryCard" style="display:none;">
        <div class="card-header">
            <h3 id="vitalsPatientTitle"><i class="fa-solid fa-heart-pulse"></i> Vitals History</h3>
            <div class="card-actions">
                <button class="btn btn-primary btn-sm" onclick="openRecordVitalsModal()">
                    <i class="fa-solid fa-plus"></i> Record Vitals
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th><th>Date &amp; Time</th><th>Temp (°C)</th>
                            <th>BP</th><th>Pulse</th><th>O₂ %</th>
                            <th>Sugar</th><th>Weight</th>
                        </tr>
                    </thead>
                    <tbody id="vitalsHistoryBody">
                        <tr><td colspan="8" class="text-center">No vitals recorded.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Record Vitals Modal -->
    <div class="modal" id="recordVitalsModal">
        <div class="modal-content modal-md">
            <div class="modal-header">
                <h3><i class="fa-solid fa-heart-pulse"></i> Record Vitals</h3>
                <button class="modal-close" onclick="closeRecordVitalsModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="vitalsPatientId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Temperature (°C)</label>
                        <input type="number" step="0.1" id="vitalTemp" placeholder="37.0">
                    </div>
                    <div class="form-group">
                        <label>Blood Pressure</label>
                        <input type="text" id="vitalBP" placeholder="120/80">
                    </div>
                    <div class="form-group">
                        <label>Pulse (bpm)</label>
                        <input type="number" id="vitalPulse" placeholder="72">
                    </div>
                    <div class="form-group">
                        <label>Respiration (rpm)</label>
                        <input type="number" id="vitalRespiration" placeholder="16">
                    </div>
                    <div class="form-group">
                        <label>Oxygen (%)</label>
                        <input type="number" step="0.1" id="vitalOxygen" placeholder="98">
                    </div>
                    <div class="form-group">
                        <label>Sugar (mg/dL)</label>
                        <input type="number" step="0.1" id="vitalSugar" placeholder="90">
                    </div>
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" step="0.1" id="vitalWeight" placeholder="65">
                    </div>
                    <div class="form-group">
                        <label>Height (cm)</label>
                        <input type="number" step="0.1" id="vitalHeight" placeholder="170">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRecordVitalsModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitVitals()">
                    <i class="fa-solid fa-check"></i> Save
                </button>
            </div>
        </div>
    </div>

</section>
