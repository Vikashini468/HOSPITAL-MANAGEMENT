<section class="doctor-section">

    <div class="page-header">
        <div>
            <h2><i class="fa-solid fa-user-doctor"></i> Assigned Doctor</h2>
            <p>View and manage doctor assignments for admitted patients.</p>
        </div>
        <div class="page-actions">
            <button class="btn btn-primary" onclick="loadDoctorSection()">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Patient Selector -->
    <div class="card">
        <div class="card-header"><h3>Select Patient</h3></div>
        <div class="card-body">
            <div class="search-bar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="doctorPatientSearch" placeholder="Search patient by name..." />
                </div>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Patient</th><th>Ward</th><th>Room</th>
                            <th>Current Doctor</th><th>Status</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="doctorPatientTableBody">
                        <tr><td colspan="7" class="text-center">Loading patients...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Assign Doctor Modal -->
    <div class="modal" id="assignDoctorModal">
        <div class="modal-content modal-md">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-doctor"></i> Assign Doctor</h3>
                <button class="modal-close" onclick="closeAssignDoctorModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="assignPatientId">
                <div class="form-group">
                    <label>Patient</label>
                    <input type="text" id="assignPatientName" readonly>
                </div>
                <div class="form-group">
                    <label>Select Doctor <span class="required">*</span></label>
                    <select id="assignDoctorSelect">
                        <option value="">Loading doctors...</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAssignDoctorModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitAssignDoctor()">
                    <i class="fa-solid fa-check"></i> Assign
                </button>
            </div>
        </div>
    </div>

</section>
