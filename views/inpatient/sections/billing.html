<section class="billing-section">

    <div class="page-header">
        <div>
            <h2><i class="fa-solid fa-file-invoice-dollar"></i> Billing</h2>
            <p>Generate and manage patient bills.</p>
        </div>
    </div>

    <!-- Patient Selector -->
    <div class="card">
        <div class="card-header"><h3>Select Patient</h3></div>
        <div class="card-body">
            <div class="search-bar">
                <div class="search-box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="billingPatientSearch" placeholder="Search patient..." />
                </div>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th><th>Patient</th><th>Doctor</th>
                            <th>Ward</th><th>Status</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="billingPatientBody">
                        <tr><td colspan="6" class="text-center">Loading patients...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Billing Form -->
    <div class="card" id="billingFormCard" style="display:none;">
        <div class="card-header">
            <h3 id="billingPatientTitle"><i class="fa-solid fa-file-invoice-dollar"></i> Generate Bill</h3>
        </div>
        <div class="card-body">
            <input type="hidden" id="billingPatientId">
            <div class="form-grid">
                <div class="form-group">
                    <label>Room Charge (₹)</label>
                    <input type="number" step="0.01" id="billRoomCharge" value="0">
                </div>
                <div class="form-group">
                    <label>Doctor Fee (₹)</label>
                    <input type="number" step="0.01" id="billDoctorFee" value="0">
                </div>
                <div class="form-group">
                    <label>Medicine Fee (₹)</label>
                    <input type="number" step="0.01" id="billMedicineFee" value="0">
                </div>
                <div class="form-group">
                    <label>Lab Fee (₹)</label>
                    <input type="number" step="0.01" id="billLabFee" value="0">
                </div>
                <div class="form-group">
                    <label>Maintenance Fee (₹)</label>
                    <input type="number" step="0.01" id="billMaintenanceFee" value="0">
                </div>
                <div class="form-group">
                    <label>Other Fee (₹)</label>
                    <input type="number" step="0.01" id="billOtherFee" value="0">
                </div>
                <div class="form-group">
                    <label>Discount (₹)</label>
                    <input type="number" step="0.01" id="billDiscount" value="0">
                </div>
                <div class="form-group">
                    <label>GST (%)</label>
                    <input type="number" step="0.01" id="billGST" value="0">
                </div>
            </div>

            <!-- Bill Summary -->
            <div class="bill-summary">
                <div class="bill-row">
                    <span>Subtotal</span>
                    <span id="billSubtotal">₹ 0.00</span>
                </div>
                <div class="bill-row">
                    <span>Discount</span>
                    <span id="billDiscountDisplay">- ₹ 0.00</span>
                </div>
                <div class="bill-row">
                    <span>GST</span>
                    <span id="billGSTDisplay">+ ₹ 0.00</span>
                </div>
                <div class="bill-row total">
                    <span>Total</span>
                    <span id="billTotal">₹ 0.00</span>
                </div>
            </div>

            <div class="form-footer">
                <button class="btn btn-secondary" onclick="calculateBill()">
                    <i class="fa-solid fa-calculator"></i> Calculate
                </button>
                <button class="btn btn-primary" onclick="submitBill()">
                    <i class="fa-solid fa-check"></i> Generate Bill
                </button>
            </div>
        </div>
    </div>

</section>
