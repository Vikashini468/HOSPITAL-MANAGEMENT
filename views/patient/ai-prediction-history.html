<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prediction History – NALAM AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body { display: flex; min-height: 100vh; background: #f4f7fb; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: linear-gradient(180deg, #0d47a1, #1565c0);
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 100vh;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    .sidebar-logo-icon {
      width: 36px;
      height: 36px;
      background: white;
      color: #0d47a1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      flex-shrink: 0;
    }

    .sidebar-logo-text { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .sidebar-logo-sub  { font-size: 10px; opacity: 0.7; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
      transition: 0.2s;
      color: white;
      font-size: 13px;
      text-decoration: none;
      user-select: none;
    }

    .nav-item:hover  { background: rgba(255,255,255,0.2); }
    .nav-item.active { background: rgba(255,255,255,0.28); font-weight: 700; }
    .nav-item .icon  { font-size: 16px; width: 20px; text-align: center; }

    .nav-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.45);
      padding: 12px 12px 4px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.15);
    }

    /* ── MAIN ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 14px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-left { font-size: 15px; font-weight: 700; color: #0d47a1; }
    .topbar-left span { font-weight: 400; color: #555; font-size: 13px; margin-left: 6px; }

    .content { padding: 22px 26px 40px; max-width: 1100px; width: 100%; margin: 0 auto; }

    .back-btn {
      background: none;
      border: none;
      color: #0d47a1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 0 10px;
      font-family: inherit;
    }

    .page-title { font-size: 22px; font-weight: 800; color: #0d47a1; margin-bottom: 4px; }
    .page-sub  { font-size: 13px; color: #777; margin-bottom: 20px; }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .4px; }
    .stat-value { font-size: 24px; font-weight: 800; margin-top: 4px; }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      align-items: flex-end;
    }
    .filter-field { flex: 1; min-width: 160px; }
    .filter-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 5px;
    }
    .filter-field select,
    .filter-field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
    }
    .clear-btn {
      padding: 8px 16px;
      background: #f0f4ff;
      color: #0d47a1;
      border: 1px solid #d4def0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .clear-btn:hover { background: #e3edff; }

    /* Prediction cards */
    .p-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 14px;
    }
    .p-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .p-disease { font-size: 17px; font-weight: 800; color: #0d47a1; }
    .p-date    { font-size: 12px; color: #888; margin-top: 3px; }
    .badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
    }
    .p-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric {
      background: #f4f8ff;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .metric .m-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px; }
    .metric .m-value { font-size: 18px; font-weight: 800; color: #0d47a1; }

    /* Explanation summary */
    .explain-box {
      background: #fbfdff;
      border: 1px solid #d0e4ff;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .explain-title {
      font-size: 11px;
      font-weight: 700;
      color: #7a4a0d;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 6px;
    }
    .chip {
      display: inline-block;
      background: #e8eef8;
      color: #0d47a1;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin: 0 4px 6px 0;
    }
    .explain-text {
      font-size: 12px;
      color: #333;
      line-height: 1.6;
      margin-top: 8px;
      max-height: 84px;
      overflow-y: auto;
    }

    .p-footer {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: #555;
    }
    .p-footer b { color: #333; }

    .no-results { text-align: center; color: #888; font-size: 14px; padding: 40px 0; }
    .loading { text-align: center; color: #888; font-size: 14px; padding: 40px 0; }

    .error-box {
      background: #fdecea;
      border: 1px solid #f5c6c0;
      color: #c62828;
      border-radius: 8px;
      padding: 14px;
      font-size: 13px;
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">N</div>
      <div>
        <div class="sidebar-logo-text">NALAM AI</div>
        <div class="sidebar-logo-sub">Health Ecosystem</div>
      </div>
    </div>

    <div class="nav-section-label">Menu</div>

    <a class="nav-item" id="nav-home" href="#" onclick="goDashboard(); return false;">
      <span class="icon">&#127968;</span> Dashboard
    </a>
    <a class="nav-item" id="nav-ai" href="#" onclick="goAI(); return false;">
      <span class="icon">&#129504;</span> AI Disease Prediction
    </a>
    <a class="nav-item active" id="nav-history" href="#" onclick="return false;">
      <span class="icon">&#128203;</span> AI Prediction History
    </a>

    <div class="sidebar-bottom">
      <a class="nav-item" href="/patient-login">
        <span class="icon">&#128275;</span> Logout
      </a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-left">AI Prediction History <span id="topbarDate"></span></div>
    </div>

    <div class="content">
      <button class="back-btn" onclick="goDashboard()">&#8592; Back to Dashboard</button>
      <div class="page-title">AI Prediction History</div>
      <div class="page-sub">All AI disease predictions made for you, latest first.</div>

      <div id="errorBox" style="display:none;"></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Predictions</div>
          <div class="stat-value" id="statTotal" style="color:#0d47a1;">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">High Risk</div>
          <div class="stat-value" id="statHigh" style="color:#c62828;">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Low Risk</div>
          <div class="stat-value" id="statLow" style="color:#166534;">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Last Updated</div>
          <div class="stat-value" id="statLatest" style="font-size:14px;color:#0d47a1;">—</div>
        </div>
      </div>

      <div class="filters">
        <div class="filter-field">
          <label>Disease</label>
          <select id="filterDisease" onchange="applyFilters()">
            <option value="">All Diseases</option>
          </select>
        </div>
        <div class="filter-field">
          <label>Date</label>
          <input type="date" id="filterDate" onchange="applyFilters()">
        </div>
        <div class="filter-field">
          <label>Doctor</label>
          <select id="filterDoctor" onchange="applyFilters()">
            <option value="">All Doctors</option>
          </select>
        </div>
        <button class="clear-btn" onclick="clearFilters()">Clear Filters</button>
      </div>

      <div id="predictionList"><p class="loading">Loading AI predictions...</p></div>
    </div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const userId = params.get("id");

let allPredictions = [];

const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

document.getElementById("topbarDate").textContent =
  new Date().toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });

function goDashboard() {
  window.location.href = userId ? `/patient/dashboard?id=${userId}` : `/patient/dashboard`;
}
function goAI() {
  window.location.href = userId ? `/patient/dashboard?id=${userId}&section=ai` : `/patient/dashboard`;
}

function fmtDate(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d)) return "—";
  return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }) +
         " · " + d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
}

function localDate(ts) {
  const d = new Date(ts);
  if (isNaN(d)) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function isHighRisk(p) {
  return String(p.prediction || "").toUpperCase() === "HIGH RISK";
}

function explanationSummary(p) {
  const x = (p && p.explanation) || null;
  if (!x) return "";
  const top = Array.isArray(x.top_features) ? x.top_features : [];
  const text = x.explanation || "";
  if (!top.length && !text) return "";
  return `
    <div class="explain-box">
      ${top.length ? `<div class="explain-title">Top Risk Factors</div>
        <div>${top.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
      ${text ? `<div class="explain-title" style="margin-top:6px;">Explanation Summary</div>
        <div class="explain-text">${esc(text)}</div>` : ''}
    </div>`;
}

function cardHtml(p) {
  const high = isHighRisk(p);
  const bg = high ? '#fdecea' : '#dcfce7';
  const fg = high ? '#c62828' : '#166534';
  return `
    <div class="p-card">
      <div class="p-head">
        <div>
          <div class="p-disease">&#129504; ${esc(p.disease || p.model_type || 'Disease Prediction')}</div>
          <div class="p-date">${fmtDate(p.predicted_at)}</div>
        </div>
        <span class="badge" style="background:${bg};color:${fg};">${esc(p.prediction || '—')}</span>
      </div>
      <div class="p-metrics">
        <div class="metric">
          <div class="m-label">Probability</div>
          <div class="m-value">${p.probability != null ? esc(p.probability) + '%' : '—'}</div>
        </div>
        <div class="metric">
          <div class="m-label">Confidence</div>
          <div class="m-value">${p.confidence != null ? esc(p.confidence) + '%' : '—'}</div>
        </div>
        <div class="metric">
          <div class="m-label">Prediction Date</div>
          <div class="m-value" style="font-size:14px;">${fmtDate(p.predicted_at)}</div>
        </div>
        <div class="metric">
          <div class="m-label">Doctor</div>
          <div class="m-value" style="font-size:14px;">${p.doctor_name ? 'Dr. ' + esc(p.doctor_name) : '—'}</div>
        </div>
      </div>
      ${explanationSummary(p)}
      <div class="p-footer">
        <span><b>Disease:</b> ${esc(p.disease || p.model_type || '—')}</span>
        <span><b>Prediction:</b> ${esc(p.prediction || '—')}</span>
        ${p.doctor_name ? `<span><b>Doctor:</b> Dr. ${esc(p.doctor_name)}</span>` : ''}
        ${p.appointment_id ? `<span><b>Visit ID:</b> ${esc(p.appointment_id)}</span>` : ''}
        ${p.visit_id ? `<span><b>Record ID:</b> ${esc(p.visit_id)}</span>` : ''}
      </div>
    </div>`;
}

function populateFilterOptions() {
  const diseaseSel = document.getElementById("filterDisease");
  const doctorSel  = document.getElementById("filterDoctor");

  const diseases = [...new Set(allPredictions.map(p => (p.disease || p.model_type || '').trim()).filter(Boolean))].sort();
  const doctors  = [...new Set(allPredictions.map(p => (p.doctor_name || '').trim()).filter(Boolean))].sort();

  diseaseSel.innerHTML = '<option value="">All Diseases</option>' +
    diseases.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');

  doctorSel.innerHTML = '<option value="">All Doctors</option>' +
    doctors.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
}

function applyFilters() {
  const disease = document.getElementById("filterDisease").value;
  const date    = document.getElementById("filterDate").value;
  const doctor  = document.getElementById("filterDoctor").value;

  let list = allPredictions;
  if (disease) list = list.filter(p => (p.disease || p.model_type || '') === disease);
  if (doctor)  list = list.filter(p => (p.doctor_name || '') === doctor);
  if (date)    list = list.filter(p => localDate(p.predicted_at) === date);

  const box = document.getElementById("predictionList");
  if (!list.length) {
    box.innerHTML = `<p class="no-results">No predictions match the selected filters.</p>`;
    return;
  }
  box.innerHTML = list.map(cardHtml).join('');
}

function clearFilters() {
  document.getElementById("filterDisease").value = "";
  document.getElementById("filterDate").value   = "";
  document.getElementById("filterDoctor").value = "";
  applyFilters();
}

async function loadPredictions() {
  const box = document.getElementById("predictionList");
  box.innerHTML = '<p class="loading">Loading AI predictions...</p>';
  if (!userId) {
    box.innerHTML = '<p class="no-results">Patient not identified. Please log in.</p>';
    return;
  }
  try {
    const res = await fetch(`/patient/predictions/${userId}`);
    if (!res.ok) throw new Error("Failed to fetch predictions");
    allPredictions = await res.json();

    if (!Array.isArray(allPredictions) || !allPredictions.length) {
      box.innerHTML = '<p class="no-results">No AI disease predictions yet. Predictions made by your doctor will appear here.</p>';
      return;
    }

    document.getElementById("statTotal").textContent = allPredictions.length;
    document.getElementById("statHigh").textContent  = allPredictions.filter(isHighRisk).length;
    document.getElementById("statLow").textContent   = allPredictions.length - allPredictions.filter(isHighRisk).length;
    document.getElementById("statLatest").textContent = fmtDate(allPredictions[0].predicted_at);

    populateFilterOptions();
    applyFilters();
  } catch (err) {
    console.error(err);
    document.getElementById("errorBox").style.display = "block";
    document.getElementById("errorBox").textContent = "Unable to load AI prediction history. Please try again.";
    box.innerHTML = '';
  }
}

loadPredictions();
</script>
</body>
</html>
